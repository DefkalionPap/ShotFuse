<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ShotFuse Editor</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ShotFuse Editor</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Only accept messages from the Figma Make parent page.
      const parentOrigin = "https://shotfuse.figma.site";
      let unityInstanceRef = null;
      let pendingProjectContext = null;

      function forwardProjectContext(data) {
        if (!unityInstanceRef) {
          // Keep the latest valid context until Unity finishes initializing.
          pendingProjectContext = data;
          return;
        }

        unityInstanceRef.SendMessage(
          "ProjectContextReceiver",
          "SetProjectContext",
          JSON.stringify({
            userId: data.userId,
            projectKey: data.projectKey
          })
        );

        console.log("[ShotFuse] Project context forwarded to Unity.");
      }

      // Receive project context from the Figma Make parent page.
      window.addEventListener("message", (event) => {
        if (event.origin !== parentOrigin) {
          console.warn(
            "[ShotFuse] Rejected message from unexpected origin:",
            event.origin
          );
          return;
        }

        if (event.source !== window.parent) {
          console.warn("[ShotFuse] Rejected message not sent by the parent window.");
          return;
        }

        const data = event.data;

        if (
          !data ||
          typeof data !== "object" ||
          Array.isArray(data) ||
          data.type !== "PROJECT_CONTEXT" ||
          typeof data.userId !== "string" ||
          typeof data.projectKey !== "string"
        ) {
          console.warn("[ShotFuse] Rejected invalid project-context message.");
          return;
        }

        forwardProjectContext(data);
      });

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type == 'error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type == "warning") {
            div.style = "background: yellow; padding: 10px;";
          }

          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/DebugBuild 4.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/DebugBuild 4.data.unityweb",
        frameworkUrl: buildUrl + "/DebugBuild 4.framework.js.unityweb",
        codeUrl: buildUrl + "/DebugBuild 4.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ShotFuse",
        productName: "ShotFuse Editor",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width =
            100 * progress + "%";
        })
          .then((unityInstance) => {
            // Keep a reference so incoming messages can be forwarded to Unity.
            unityInstanceRef = unityInstance;

            document.querySelector("#unity-loading-bar").style.display = "none";

            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };

            // Forward a context that arrived before Unity was ready.
            if (pendingProjectContext) {
              const contextToSend = pendingProjectContext;
              pendingProjectContext = null;
              forwardProjectContext(contextToSend);
            }

            // Tell the parent it is now safe to send project context.
            window.parent.postMessage(
              { type: "UNITY_READY" },
              parentOrigin
            );

            console.log("[ShotFuse] Sent UNITY_READY to parent.");
          })
          .catch((message) => {
            console.error("[ShotFuse] Unity failed to initialize:", message);
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
