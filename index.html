<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      #unity-canvas {
        display: block;
        width: 960px;
        height: 600px;
        border: 0;
        outline: none;
      }

      #unity-loading-bar {
        display: none;
      }

      #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
      }

      @media (max-width: 960px), (max-height: 600px) {
        #unity-canvas {
          width: 100vw;
          height: 100vh;
        }
      }
    </style>
  </head>

  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;

        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        warningBanner.appendChild(div);
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ShotFuse.data",
        frameworkUrl: buildUrl + "/ShotFuse.framework.js",
        codeUrl: buildUrl + "/ShotFuse.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ShotFuse Unity",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.head.appendChild(meta);
        canvas.className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/ShotFuse.loader.js";

      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var progressBar = document.querySelector(
            "#unity-progress-bar-full"
          );

          if (progressBar) {
            progressBar.style.width = 100 * progress + "%";
          }
        }).then(function () {
          var loadingBar = document.querySelector("#unity-loading-bar");
          if (loadingBar) {
            loadingBar.style.display = "none";
          }
        }).catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
