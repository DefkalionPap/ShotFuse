<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotFuse Editor</title>
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
      }

      #unity-loading-bar {
        display: none !important;
      }

      #unity-footer {
        display: none !important;
      }

      #unity-warning {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar"></div>
      <div id="unity-warning"></div>
    </div>

    <script>
      const canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const div = document.createElement("div");

        div.textContent = msg;
        div.style.cssText = type === "error"
          ? "background:red;padding:10px;color:white;"
          : "background:yellow;padding:10px;color:black;";

        warningBanner.appendChild(div);

        if (type !== "error") {
          setTimeout(() => div.remove(), 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/ShotFuse Editor GitHub.loader.js";

      const config = {
        arguments: [],
        dataUrl: buildUrl + "/ShotFuse Editor GitHub.data.unityweb",
        frameworkUrl: buildUrl + "/ShotFuse Editor GitHub.framework.js.unityweb",
        codeUrl: buildUrl + "/ShotFuse Editor GitHub.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ShotFuse",
        productName: "ShotFuse Editor",
        productVersion: "0.1.0",
        showBanner: unityShowBanner
      };

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
